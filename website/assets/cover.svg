<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">UnionMimic — From sensing to learning.</title>
  <desc id="desc">Visuotactile sensing meets short-horizon policy learning. A single connected mechanical hand holds an object below four imagined future states and a model-only return-gradient path.</desc>
  <rect width="1280" height="560" fill="#f4f2ea"/>
  <path d="M56 52v23a17 17 0 0 0 34 0V52m-17 0v23a17 17 0 0 0 34 0V52" fill="none" stroke="#292d25" stroke-width="3"/>
  <text x="125" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="-1" fill="#292d25">unionmimic</text>
  <text x="57" y="169" font-family="monospace" font-size="12" letter-spacing="1.4" fill="#66675b">AN EXPERIMENT IN EMBODIED LEARNING</text>
  <text x="53" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="-2" fill="#292d25">From sensing</text>
  <text x="53" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="-2" fill="#a74f35">to learning.</text>
  <text x="57" y="386" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#66675b">Visuotactile world models for dexterous control.</text>
  <text x="57" y="423" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#66675b">WM-Craftnet sensing × SuperMimic-style learning</text>
  <path d="M57 493H657" stroke="#cecabe"/>
  <text x="57" y="525" font-family="monospace" font-size="11" letter-spacing=".7" fill="#66675b">OBSERVE → IMAGINE → IMPROVE</text>
  <text x="657" y="525" text-anchor="end" font-family="monospace" font-size="10" fill="#66675b">RESEARCH PREVIEW / 2026</text>
  <rect x="720" width="560" height="560" fill="#e5e8db"/>
  <svg x="720" y="0" width="560" height="560" viewBox="0 0 560 590">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#b9c0ae"/></pattern>
    <marker id="forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#66745b" stroke-width="1.4"/></marker>
    <marker id="gradient" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#a3543b" stroke-width="1.4"/></marker>
    <g id="predicted-object" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="m0-23 23 13v26L0 29l-23-13v-26Z"/><path d="m-23-10 23 13 23-13M0 3v26"/></g>
  </defs>
  <rect width="560" height="590" rx="3" fill="#e5e8db"/>
  <rect x="20" y="20" width="520" height="550" fill="url(#dots)"/>
  <g font-family="monospace" font-size="10" letter-spacing=".7" fill="#526048">
    <text x="30" y="35">STUDY 01 / SENSE, IMAGINE, IMPROVE</text>
    <text x="530" y="35" text-anchor="end">WM + SM</text>
  </g>

  <!-- The entire gradient path stays inside the learned-model region. -->
  <rect x="58" y="66" width="472" height="184" rx="5" fill="#f4f2ea" stroke="#a9b19e" stroke-dasharray="4 5"/>
  <text x="77" y="89" font-family="monospace" font-size="10" letter-spacing=".5" fill="#526048">ACTOR ↔ WORLD MODEL</text>
  <text x="511" y="89" text-anchor="end" font-family="monospace" font-size="10" fill="#526048">IMAGINE / H = 4</text>
  <g color="#596b4e"><use href="#predicted-object" transform="translate(110 137) rotate(-8)"/></g>
  <g color="#738366"><use href="#predicted-object" transform="translate(222 137) rotate(0)"/></g>
  <g color="#87967a"><use href="#predicted-object" transform="translate(334 137) rotate(8)"/></g>
  <g color="#87967a"><use href="#predicted-object" transform="translate(446 137) rotate(16)"/></g>
  <g fill="none" stroke="#66745b" stroke-width="1.2" marker-end="url(#forward)"><path d="M147 140h34"/><path d="M259 140h34"/><path d="M371 140h34"/></g>
  <g font-family="monospace" font-size="10" text-anchor="middle" fill="#59674f"><text x="110" y="187">t + 1</text><text x="222" y="187">t + 2</text><text x="334" y="187">t + 3</text><text x="446" y="187">t + 4</text></g>
  <path d="M469 179v28H89v-24" fill="none" stroke="#a3543b" stroke-width="1.5" marker-end="url(#gradient)"/>
  <text x="294" y="233" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing=".4" fill="#9a4e36">RETURN GRADIENT → POLICY UPDATE</text>

  <!-- Only sensor evidence travels from the physical scene into the model. -->
  <path d="M176 378H50q-14 0-14-14V145h20" fill="none" stroke="#66745b" stroke-width="1.2" marker-end="url(#forward)"/>
  <text transform="translate(25 347) rotate(-90)" font-family="monospace" font-size="9" letter-spacing=".7" fill="#59674f">SENSOR HISTORY → BELIEF</text>
  <text x="484" y="287" text-anchor="end" font-family="monospace" font-size="10" letter-spacing=".5" fill="#526048">OBSERVE / CONTACT</text>
  <path d="M479 297v39l-115 50" fill="none" stroke="#98a28b" stroke-width="1"/>

  <!-- All five digits share a single closed palm and wrist. -->
  <g stroke="#3e4c35" stroke-width="1.8" stroke-linejoin="round">
    <path d="M217 502h77v49h-77Z" fill="#d4dac8"/>
    <path d="m204 415 93-3 25 61-28 35h-82l-26-39Z" fill="#cbd3be"/>
    <path d="m218 447 67-4 15 31-19 19h-57l-17-23Z" fill="#e8eadf" stroke="#8d9a7c" stroke-width="1"/>
    <path d="M217 532h77" stroke="#8d9a7c" stroke-width="1"/>
  </g>

  <!-- Wide, rounded links and pivot centers form four articulated fingers. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#3e4c35" stroke-width="22">
      <path d="m209 434-36-50 11-38 30-1"/>
      <path d="m231 424-31-64 7-45 29 1"/>
      <path d="m256 423-12-65 1-70 19 10"/>
      <path d="m280 429 34-64 13-39-28-8"/>
      <path d="m311 470 46-43-5-42-37-15"/>
    </g>
    <g stroke="#e8eadf" stroke-width="18">
      <path d="m209 434-36-50 11-38 30-1"/>
      <path d="m231 424-31-64 7-45 29 1"/>
      <path d="m256 423-12-65 1-70 19 10"/>
      <path d="m280 429 34-64 13-39-28-8"/>
      <path d="m311 470 46-43-5-42-37-15"/>
    </g>
  </g>
  <g fill="#bec8ae" stroke="#526147" stroke-width="1.2">
    <circle cx="209" cy="434" r="4"/><circle cx="173" cy="384" r="4"/><circle cx="184" cy="346" r="4"/>
    <circle cx="231" cy="424" r="4"/><circle cx="200" cy="360" r="4"/><circle cx="207" cy="315" r="4"/>
    <circle cx="256" cy="423" r="4"/><circle cx="244" cy="358" r="4"/><circle cx="245" cy="288" r="4"/>
    <circle cx="280" cy="429" r="4"/><circle cx="314" cy="365" r="4"/><circle cx="327" cy="326" r="4"/>
    <circle cx="311" cy="470" r="4"/><circle cx="357" cy="427" r="4"/><circle cx="352" cy="385" r="4"/>
  </g>
  <!-- The object occludes the rear links. Contact markers lie on its boundary. -->
  <g stroke="#81503b" stroke-width="1.2" stroke-linejoin="round">
    <path d="m264 298 51 30v62l-51 32-51-32v-62Z" fill="#bb7052"/>
    <path d="m213 328 51-30 51 30-51 31Z" fill="#d79d7a"/>
    <path d="m264 359 51-31v62l-51 32Z" fill="#a55c42"/>
    <path d="m213 328 51 31v63" fill="none" stroke="#f2c6a5"/>
  </g>
  <g fill="#f4f2ea" stroke="#465a3a" stroke-width="1.8"><circle cx="213" cy="345" r="4"/><circle cx="236" cy="315" r="4"/><circle cx="264" cy="298" r="4"/><circle cx="299" cy="318" r="4"/><circle cx="315" cy="370" r="4"/></g>
  <g fill="none" stroke="#8e9c80" stroke-width="1" stroke-dasharray="2 4"><circle cx="213" cy="345" r="10"/><circle cx="315" cy="370" r="10"/></g>
  <text x="412" y="461" font-family="monospace" font-size="9" letter-spacing=".3" fill="#59674f">ONE HAND</text>
  <text x="412" y="477" font-family="monospace" font-size="9" letter-spacing=".3" fill="#59674f">ONE OBJECT</text>
  <path d="M397 470h-23" stroke="#98a28b"/>
  <path d="M30 570h500" stroke="#bcc4b1"/>
  <text x="30" y="585" font-family="monospace" font-size="8" letter-spacing=".5" fill="#59674f">VISUOTACTILE SENSING × SHORT-HORIZON POLICY LEARNING</text>

  </svg>
</svg>
